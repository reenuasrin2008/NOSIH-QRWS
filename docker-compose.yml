version: "3.9"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend:/app

  quantum-world:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:world -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  quantum-operations:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:operations -- --host 0.0.0.0"
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  quantum-jarvis:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:jarvis -- --host 0.0.0.0"
    ports:
      - "5175:5175"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
